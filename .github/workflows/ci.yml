name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ai_digital_office
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_admin -d ai_digital_office"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://ai_admin:ci_password@localhost:5433/ai_digital_office

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable pgvector
        run: |
          PGPASSWORD=ci_password psql \
            -h localhost \
            -p 5433 \
            -U ai_admin \
            -d ai_digital_office \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing